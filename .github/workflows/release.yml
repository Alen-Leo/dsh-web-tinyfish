name: Release dsh-web-tinyfish

# Publishes dsh-web-tinyfish as a GitHub Release with the packed tarball —
# deliberately NOT to npm: the npm name `dsh-web-tinyfish` belongs to an
# unrelated third-party package, and the documented install path is the
# tarball (see INSTALL.md).
# Tag with: dsh-web-tinyfish-v0.3.0

on:
  push:
    tags:
      - 'dsh-web-tinyfish-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Check tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "dsh-web-tinyfish-$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Pack tarball
        run: pnpm pack --pack-destination dist

      - name: Create GitHub Release with the tarball
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
